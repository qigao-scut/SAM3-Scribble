<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">SAM3-Scribble</title>
  <desc id="desc">Sparse scribbles, text prompts and medical image segmentation, on a dark background with an abstract connected-node motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081426"/>
      <stop offset="1" stop-color="#17213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#57e3f2"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#246995" stop-opacity=".32"/>
      <stop offset="1" stop-color="#246995" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#6cbcd1" stroke-opacity=".065"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#background)"/>
  <rect width="1280" height="300" rx="20" fill="url(#grid)"/>
  <ellipse cx="1040" cy="145" rx="245" ry="180" fill="url(#halo)"/>
  <path d="M1 280H1279" stroke="url(#accent)" stroke-opacity=".35"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="54" y="53" font-size="12" letter-spacing="3" fill="#80dce9">TEXT-PROMPTED MEDICAL SEGMENTATION</text>
    <text x="50" y="135" font-size="65" font-weight="700" letter-spacing="-2" fill="#f2f7ff">SAM3-Scribble</text>
    <text x="54" y="178" font-size="22" fill="#bacbdf">Sparse scribbles. Text prompts. Medical imaging.</text>
    <g font-size="11" font-weight="600" letter-spacing="1">
      <rect x="54" y="216" width="172" height="32" rx="16" fill="#113044" stroke="#367b8e"/>
      <text x="140" y="237" text-anchor="middle" fill="#9cebf3">SPARSE SUPERVISION</text>
      <rect x="239" y="216" width="145" height="32" rx="16" fill="#1c2948" stroke="#4d669a"/>
      <text x="311.5" y="237" text-anchor="middle" fill="#b9d2ff">TEXT PROMPTS</text>
      <rect x="397" y="216" width="145" height="32" rx="16" fill="#2b2548" stroke="#756299"/>
      <text x="469.5" y="237" text-anchor="middle" fill="#dbc8ff">HYBRID LORA</text>
    </g>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="1.5">
    <ellipse cx="1023" cy="150" rx="166" ry="93" transform="rotate(-24 1023 150)" opacity=".4"/>
    <ellipse cx="1023" cy="150" rx="117" ry="108" transform="rotate(28 1023 150)" opacity=".28"/>
    <path d="M854 181L929 83L1004 160L1086 74L1186 145L1108 226L1004 160L941 237L854 181M929 83L1086 74M1186 145L1004 160M1108 226L941 237" opacity=".7"/>
    <path d="M832 99L854 181M1186 145L1229 96M1108 226L1180 264" opacity=".25" stroke-dasharray="4 6"/>
  </g>
  <g fill="#10263c" stroke="url(#accent)" stroke-width="2">
    <circle cx="854" cy="181" r="7"/>
    <circle cx="929" cy="83" r="9"/>
    <circle cx="1004" cy="160" r="13" fill="#26566d"/>
    <circle cx="1086" cy="74" r="7"/>
    <circle cx="1186" cy="145" r="10"/>
    <circle cx="1108" cy="226" r="8"/>
    <circle cx="941" cy="237" r="6"/>
  </g>
  <circle cx="1004" cy="160" r="22" fill="none" stroke="#69dce9" stroke-opacity=".28"/>
  <rect x=".5" y=".5" width="1279" height="299" rx="20" fill="none" stroke="#719bb5" stroke-opacity=".25"/>
</svg>
